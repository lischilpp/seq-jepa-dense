[project]
name = "seq-jepa-dense"
version = "1.0.0"
description = "Training and evaluation code for seq-JEPA-dense and the baselines SimCLR and seq-JEPA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=5.0.0",
    "lightning>=2.6.6",
    "matplotlib>=3.11.0",
    "numpy>=2.4.6",
    "scikit-learn>=1.9.0",
    "torch>=2.13.0",
    "torchmetrics>=1.9.0",
    "torchvision>=0.28.0",
    "tqdm>=4.68.4",
    "umap-learn>=0.5.12",
]

[build-system]
requires = ["uv_build>=0.12.8,<0.13"]
build-backend = "uv_build"
